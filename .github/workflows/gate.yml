name: quality gate

# Runs on every pull request into main. Merging is blocked until it passes and
# a human approves — see CONTRIBUTING for the flow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs uv from a prebuilt binary and restores the wheel cache,
      # keyed on uv.lock — so an unchanged lockfile downloads nothing.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: install dependencies
        run: uv sync --dev

      # --cov-fail-under lives here rather than in pyproject's addopts, because
      # there it would also apply to `pytest -m live`, where two tests cover
      # almost nothing.
      #
      # 89 is what the suite measures today, not a target. The table prints a
      # rounded 90%; the real figure is 89.58%, and --cov-fail-under compares
      # against the real one, so 90 here would fail the build on the number the
      # report shows as passing. It is a ratchet against regression: it moves
      # up deliberately when tests are added, never quietly down.
      - name: tests
        run: |
          set -o pipefail
          uv run pytest -q --cov-fail-under=89 --cov-report=html --durations=10 \
            | tee /tmp/pytest.txt
          {
            echo '## Tests'
            echo '```'
            tail -40 /tmp/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even when the step above failed, since a coverage drop is
      # exactly when you want to click through the report.
      - name: coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: code smells
        # E,F correctness · B bug shapes · S security · SIM,UP,I hygiene
        run: uv run ruff check . --output-format=github

      - name: dependency vulnerabilities
        run: uv run pip-audit --progress-spinner off --skip-editable

      - name: no committed secrets
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked — it holds the API key"
            exit 1
          fi
          if git grep -nIE 'sk-ant-[A-Za-z0-9_-]{20,}' -- . ':!.github/**'; then
            echo "::error::an API key looks committed — revoke it, do not just delete the commit"
            exit 1
          fi
          echo "no secrets found"
