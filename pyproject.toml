[project]
name = "ninja-agent"
version = "0.1.0"
description = "Ninja — a personal assistant that is a cast of agents, built one layer at a time."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[project.scripts]
ninja = "ninja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is "ninja-agent" (pip install ninja-agent) but the package
# you import is "ninja". Hatchling can't guess that, so point it at the dir.
[tool.hatch.build.targets.wheel]
packages = ["ninja"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E,F pyflakes+pycodestyle · B bugbear (real bug shapes) · S bandit (security)
# SIM simplify · UP modern syntax · I import order
select = ["E", "F", "B", "S", "SIM", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and assert is S101.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live test is the only one that spends money, so it is deselected here and
# never runs in the PR gate. The post-merge smoke workflow opts back in with
# `pytest -m live` — a later -m on the command line wins over this one.
addopts = "-m 'not live'"
markers = ["live: hits the real API — costs real tokens, post-merge only"]
