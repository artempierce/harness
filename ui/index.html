<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ninja cockpit</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a21; --panel-2: #1b212a; --line: #242b35;
    --ink: #e3e8ef; --dim: #8b95a3; --faint: #5a6472;
    --harness: #f0798d; --loop: #e0a252; --ops: #8ba1f2; --ok: #5dc48d;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-columns: 210px 1fr 380px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 system-ui, -apple-system, sans-serif;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }

  /* ---------- left: nav ---------- */
  .nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 0; overflow-y: auto; }
  .brand { padding: 0 16px 16px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .brand h1 { font-size: 16px; letter-spacing: -.01em; }
  .brand span { font-size: 11px; color: var(--faint); font-family: var(--mono); }
  .nav-label { font: 500 10px/1 var(--mono); letter-spacing: .14em; color: var(--faint);
               text-transform: uppercase; padding: 0 16px; margin: 16px 0 8px; }
  .nav a {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 7px 16px; color: var(--dim); text-decoration: none; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .nav a:hover { background: var(--panel-2); color: var(--ink); }
  .nav a.on { color: var(--ink); background: var(--panel-2); border-left-color: var(--harness); }
  .nav a.off { color: var(--faint); cursor: default; }
  .nav a.off:hover { background: none; color: var(--faint); }
  .tag { font: 500 9.5px/1 var(--mono); color: var(--faint); border: 1px solid var(--line);
         border-radius: 3px; padding: 3px 5px; white-space: nowrap; }
  .count { font: 500 11px var(--mono); color: var(--ok); }

  /* ---------- middle: the system ---------- */
  .main { overflow-y: auto; padding: 22px 26px 40px; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .head h2 { font-size: 19px; }
  .live { font: 500 10px var(--mono); color: var(--ok); }
  .path { font: 11px var(--mono); color: var(--faint); margin-bottom: 22px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; margin-bottom: 26px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .tile b { display: block; font: 600 20px/1.2 var(--mono); letter-spacing: -.02em; }
  .tile span { font: 10px/1 var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }

  .section-label { font: 500 10px var(--mono); letter-spacing: .14em; color: var(--faint);
                   text-transform: uppercase; margin: 0 0 12px; }

  /* architecture strip */
  .arch { display: flex; align-items: stretch; gap: 8px; margin-bottom: 28px; overflow-x: auto; padding-bottom: 4px; }
  .box { flex: 1 0 auto; min-width: 118px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 11px 12px; border-top: 2px solid var(--edge, var(--line)); }
  .box.harness { --edge: var(--harness); } .box.loop { --edge: var(--loop); } .box.ops { --edge: var(--ops); }
  .box.dim { opacity: .38; }
  .box b { display: block; font-size: 12.5px; margin-bottom: 3px; }
  .box span { font: 10px/1.35 var(--mono); color: var(--faint); display: block; }
  .arrow { align-self: center; color: var(--faint); font-size: 14px; }

  /* trace list + detail */
  .row { display: grid; grid-template-columns: 38px 1fr 62px 54px 92px 74px; gap: 10px; align-items: center;
         padding: 8px 10px; border-radius: 5px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
  .row:hover { background: var(--panel); }
  .row.on { background: var(--panel-2); }
  .row .who { font-family: system-ui, sans-serif; color: var(--ink); overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
  .row .n { color: var(--faint); }
  .row .num { text-align: right; color: var(--dim); }

  .steps { margin-top: 8px; }
  .step { display: grid; grid-template-columns: 24px 58px 1fr auto; gap: 10px; padding: 9px 10px;
          border-left: 2px solid var(--line); margin-left: 6px; font-family: var(--mono); font-size: 11.5px; }
  .step.model { border-left-color: var(--ops); }
  .step.tool { border-left-color: var(--loop); }
  .step.err { border-left-color: var(--harness); }
  .step .k { color: var(--faint); }
  .step .d { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .step .t { color: var(--faint); text-align: right; white-space: nowrap; }
  .preview { grid-column: 3 / -1; color: var(--faint); font-size: 10.5px; margin-top: 3px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--faint); font-size: 12.5px; padding: 18px 10px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          padding: 12px 14px; margin-bottom: 8px; }
  .card-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-h b { font: 600 13px var(--mono); }
  .card p { margin: 7px 0 0; color: var(--dim); font-size: 12.5px; }
  .args { font: 11px var(--mono); color: var(--faint); }
  .chip { font: 500 9.5px/1 var(--mono); border-radius: 3px; padding: 4px 6px;
          text-transform: uppercase; letter-spacing: .08em; border: 1px solid currentColor; }
  .chip.read, .chip.live, .chip.built { color: var(--ok); }
  .chip.soon, .chip.planned { color: var(--faint); }
  .chip.scaffold { color: var(--loop); }
  .row.mem { grid-template-columns: 44px 62px 1fr 64px 74px; cursor: default; align-items: baseline; }
  .row.mem .who { white-space: normal; }
  .row.mem.recalled { background: #16202a; }
  .row.growth { grid-template-columns: 34px 1fr auto; cursor: default; }
  .row.growth.planned .who { color: var(--faint); }

  /* ---------- right: chat ---------- */
  .chat { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  .chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex;
               justify-content: space-between; align-items: baseline; }
  .chat-head h3 { font-size: 14px; }
  .chat-head span { font: 10px var(--mono); color: var(--faint); }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 9px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .msg.you { align-self: flex-end; background: #2d3f6b; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); }
  .msg.sys { align-self: flex-start; font: 10.5px var(--mono); color: var(--faint); background: none; padding: 0; }
  .msg.sys a { color: var(--ops); cursor: pointer; }
  .composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; }
  .composer input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 11px; color: var(--ink); font: 13px system-ui, sans-serif;
  }
  .composer input:focus { outline: none; border-color: var(--ops); }
  .composer button {
    background: var(--ops); border: 0; border-radius: 6px; padding: 0 16px;
    color: #0e1116; font: 600 12.5px system-ui, sans-serif; cursor: pointer;
  }
  .composer button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><h1>ninja</h1><span id="brand-model">…</span></div>
  <div class="nav-label">System</div>
  <a data-view="overview" class="on">Overview</a>
  <a data-view="loop">Loop <span class="count" id="c-turns">0</span></a>
  <a data-view="tools">Tools <span class="count" id="c-tools">0</span></a>
  <a data-view="guardrails">Guardrails <span class="count" id="c-rails">0</span></a>
  <a data-view="memory">Memory <span class="count" id="c-mem">0</span></a>
  <a data-view="growth">Growth <span class="count" id="c-built">0/15</span></a>
  <div class="nav-label">Not built yet</div>
  <a data-view="soon" data-layer="5">Semantic <span class="tag">L5</span></a>
  <a data-view="soon" data-layer="7">Personas <span class="tag">L7</span></a>
  <a data-view="soon" data-layer="11">Testing <span class="tag">L11</span></a>
</nav>

<main class="main">
  <div class="head"><h2 id="view-title">Overview</h2><span class="live">● live</span></div>
  <div class="path" id="view-sub">.ninja/state.db · built through layer 3 of 15</div>
  <div id="view"></div>
</main>

<aside class="chat">
  <div class="chat-head"><h3>Chat</h3><span id="wm-badge">working memory: 0</span></div>
  <div class="log" id="log">
    <div class="msg sys">Ninja can read files in this project. Try: what does this project depend on?</div>
  </div>
  <form class="composer" id="composer">
    <input id="input" placeholder="Message Ninja…" autocomplete="off" autofocus>
    <button id="send">Send</button>
  </form>
</aside>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view = 'overview', openTrace = null, layerHint = null;

document.querySelectorAll('.nav a').forEach(a => a.onclick = () => {
  document.querySelectorAll('.nav a').forEach(x => x.classList.remove('on'));
  a.classList.add('on');
  view = a.dataset.view;
  layerHint = a.dataset.layer;
  $('view-title').textContent = a.childNodes[0].textContent.trim();
  render();
});

async function get(path) { return (await fetch(path)).json(); }

async function render() {
  const el = $('view');
  if (view === 'overview')   return el.innerHTML = await overview();
  if (view === 'loop')       return el.innerHTML = await loop();
  if (view === 'tools')      return el.innerHTML = await toolsView();
  if (view === 'guardrails') return el.innerHTML = await rails();
  if (view === 'memory')     return el.innerHTML = await memory();
  if (view === 'growth')     return el.innerHTML = await growth();
  if (view === 'soon')       return el.innerHTML = soon();
}

async function overview() {
  const s = await get('/api/stats');
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="tiles">
      ${tile('$' + s.cost.toFixed(4), 'spent')}
      ${tile((s.avg_ms/1000).toFixed(1) + 's', 'avg turn')}
      ${tile(s.turns, 'turns')}
      ${tile(s.tool_calls, 'tool calls')}
      ${tile((s.input_tokens + s.output_tokens).toLocaleString(), 'tokens')}
      ${tile(s.working_memory, 'working mem')}
    </div>
    <p class="section-label">Architecture — dimmed boxes aren't built yet</p>
    <div class="arch">
      <div class="box harness"><b>Gateway</b><span>cli · web</span></div><div class="arrow">→</div>
      <div class="box harness"><b>Working memory</b><span>${s.working_memory} messages</span></div><div class="arrow">→</div>
      <div class="box loop"><b>Loop + tools</b><span>${s.tool_calls} calls · cap 6</span></div><div class="arrow">→</div>
      <div class="box harness"><b>Reply</b><span>end-loop guardrail</span></div><div class="arrow">→</div>
      <div class="box ops"><b>Trace</b><span>${s.turns} recorded</span></div><div class="arrow">→</div>
      <div class="box harness"><b>Episodic</b><span id="a-mem">recall ${s.working_memory ? 'on' : 'on'}</span></div><div class="arrow">→</div>
      <div class="box ops dim"><b>Eval</b><span>layer 11</span></div>
    </div>` + await loop();
}

async function loop() {
  const rows = await get('/api/traces');
  if (!rows.length) return `<p class="section-label">Turns</p><p class="empty">No turns yet. Say something on the right.</p>`;
  return `<p class="section-label">Turns — click one to open it</p>` + rows.map(r =>
    `<div class="row${r.id === openTrace ? ' on' : ''}" onclick="show(${r.id})">
      <span class="n">#${r.id}</span><span class="who">${esc(r.user_input)}</span>
      <span class="num">${(r.duration_ms/1000).toFixed(1)}s</span>
      <span class="num">${r.model_calls} calls</span>
      <span class="num">${r.input_tokens}/${r.output_tokens}</span>
      <span class="num">$${r.cost_usd.toFixed(5)}</span></div>`).join('') + '<div id="detail"></div>';
}

async function toolsView() {
  const ts = await get('/api/tools');
  return `<p class="section-label">${ts.length} tools — this is the exact text the model reads when deciding to call one</p>` +
    ts.map(t => `<div class="card"><div class="card-h"><b>${esc(t.name)}</b>
      <span class="chip read">read-only</span>
      <span class="args">(${t.params.join(', ')})</span></div>
      <p>${esc(t.description)}</p></div>`).join('') +
    `<p class="empty">write_file · run_command · search_web · delegate — layers 8 to 14</p>`;
}

async function rails() {
  const g = await get('/api/guardrails');
  const card = r => `<div class="card"><div class="card-h"><b>${esc(r.name)}</b>
      <span class="chip ${r.live ? 'live' : 'soon'}">${r.live ? 'enforced' : 'layer ' + r.layer}</span>
      <span class="args">${esc(r.value)}</span></div>
      <p>stops: ${esc(r.stops)}</p></div>`;
  return `<p class="section-label">Enforced now — values read from the running code</p>` +
    g.filter(r => r.live).map(card).join('') +
    `<p class="section-label" style="margin-top:24px">Arrives with the capability it constrains</p>` +
    g.filter(r => !r.live).map(card).join('');
}

async function memory() {
  const m = await get('/api/memory');
  const st = m.stats;
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  let out = `<div class="tiles">
      ${tile(st.messages, 'messages kept')}
      ${tile(st.sessions, 'sessions')}
      ${tile(st.recall, 'recalled at start')}
    </div>
    <p class="section-label">Episodic — every turn, oldest at the bottom.
      The top ${st.recall} go back into working memory when Ninja starts.</p>`;
  if (!m.history.length) return out + `<p class="empty">Nothing remembered yet.</p>`;
  return out + m.history.map((h, i) =>
    `<div class="row mem ${i < st.recall ? 'recalled' : ''}">
       <span class="n">#${h.id}</span>
       <span class="chip ${h.role === 'user' ? 'soon' : 'live'}">${h.role}</span>
       <span class="who">${esc(h.content)}</span>
       <span class="num">${h.created_at.slice(11, 19)}</span>
       <span class="num">${h.trace_id ? 'trace #' + h.trace_id : ''}</span>
     </div>`).join('');
}

async function growth() {
  const s = await get('/api/system');
  let out = '', phase = null;
  for (const l of s.layers) {
    if (l.phase !== phase) { phase = l.phase; out += `<p class="section-label" style="margin-top:20px">${phase}</p>`; }
    out += `<div class="row growth ${l.status}"><span class="n">${String(l.n).padStart(2,'0')}</span>
      <span class="who">${esc(l.name)}</span>
      <span class="chip ${l.status}">${l.status}</span></div>`;
  }
  return out;
}

function soon() {
  return `<p class="empty">This panel arrives at layer ${layerHint}. It will read from the same
    database the traces already use — nothing here is a separate system, every tab is a layer rendered.</p>`;
}

async function show(id) {
  openTrace = id;
  const t = await get('/api/traces/' + id);
  if (view !== 'loop' && view !== 'overview') return;
  await render();
  const d = $('detail'); if (!d) return;
  d.innerHTML = `<p class="section-label" style="margin-top:22px">Trace #${t.id} — ${t.events.length} events in ${(t.duration_ms/1000).toFixed(1)}s</p>` +
    t.events.map((e, i) => e.type === 'model'
      ? `<div class="step model"><span class="k">${i+1}</span><span class="k">model</span>
         <span class="d">${e.in} in / ${e.out} out → ${e.stop}</span><span class="t">${e.ms}ms</span></div>`
      : `<div class="step ${e.ok ? 'tool' : 'tool err'}"><span class="k">${i+1}</span>
         <span class="k">${e.ok ? 'tool' : 'error'}</span>
         <span class="d">${esc(e.name)}(${esc(JSON.stringify(e.args))})</span>
         <span class="t">${e.ms}ms · ${e.bytes}b</span>
         <span class="preview">${esc(e.preview)}</span></div>`).join('');
}

async function counters() {
  const [s, t, g, sys] = await Promise.all(
    ['/api/stats','/api/tools','/api/guardrails','/api/system'].map(get));
  $('c-turns').textContent = s.turns;
  $('c-tools').textContent = t.length;
  $('c-rails').textContent = g.filter(r => r.live).length;
  const mem = await get('/api/memory');
  $('c-mem').textContent = mem.stats.messages;
  const box = document.getElementById('a-mem');
  if (box) box.textContent = mem.stats.messages + ' kept';
  $('c-built').textContent = sys.layers.filter(l => l.status === 'built').length + '/15';
  $('brand-model').textContent = sys.model;
  $('wm-badge').textContent = 'working memory: ' + s.working_memory;
}

function say(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}

$('composer').onsubmit = async ev => {
  ev.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = ''; $('send').disabled = true;
  say('you', text);
  const pending = say('sys', 'thinking…');
  try {
    const r = await (await fetch('/api/chat', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})})).json();
    pending.remove();
    say('bot', r.reply);
    const link = say('sys', '');
    link.innerHTML = `trace <a onclick="show(${r.trace_id})">#${r.trace_id}</a> · working memory ${r.working_memory}`;
    await counters(); await show(r.trace_id);
  } catch (err) { pending.remove(); say('sys', 'failed: ' + err.message); }
  $('send').disabled = false; $('input').focus();
};

counters(); render();
setInterval(() => { counters(); if (view === 'overview' || view === 'loop') render(); }, 5000);
</script>
</body>
</html>
