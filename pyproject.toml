[project]
name = "ninja-agent"
version = "0.1.0"
description = "Ninja — a personal assistant that is a cast of agents, built one layer at a time."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
]

[project.scripts]
ninja = "ninja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is "ninja-agent" (pip install ninja-agent) but the package
# you import is "ninja". Hatchling can't guess that, so point it at the dir.
[tool.hatch.build.targets.wheel]
packages = ["ninja"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E,F pyflakes+pycodestyle · B bugbear (real bug shapes) · S bandit (security)
# SIM simplify · UP modern syntax · I import order
select = ["E", "F", "B", "S", "SIM", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and assert is S101.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live test is the only one that spends money, so it is deselected here and
# never runs in the PR gate. The post-merge smoke workflow opts back in with
# `pytest -m live` — a later -m on the command line wins over this one.
#
# Coverage runs on every invocation — the suite stays under two seconds with it.
# --cov-fail-under is deliberately NOT here: it would fail `pytest -m live`,
# where two tests cover almost nothing. The threshold belongs to the gate.
addopts = "-m 'not live' --cov=ninja --cov-report=term-missing:skip-covered"
markers = ["live: hits the real API — costs real tokens, post-merge only"]

[tool.coverage.run]
source = ["ninja"]

[tool.coverage.report]
# `python -m ninja` is a two-line shim around cli.main. Its import runs on
# every suite; its call would only ever test argparse.
omit = ["ninja/__main__.py"]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mutmut]
# Coverage measures which lines ran. This measures whether anything would
# notice if they ran differently — the check that catches a test asserting
# nothing, which is how several tests in this repo looked green while proving
# nothing. Slow by nature, because the suite runs once per mutant, so it is a
# manual job and never the pull request gate.
#
# mutmut 3.x renamed these. `paths_to_mutate` and `tests_dir` still parse but
# warn, and both want lists — a string raises a TypeError deep inside the
# config loader rather than saying so. There is no `runner` key any more;
# extra pytest arguments go through pytest_add_cli_args instead.
source_paths = ["ninja/"]
pytest_add_cli_args_test_selection = ["tests/"]
# --no-cov because measuring a mutant's coverage is wasted work, and -x so a
# mutant caught by the first failing test stops there instead of running on.
# `-m 'not live'` already comes from addopts, so no mutant run spends money.
pytest_add_cli_args = ["-x", "-q", "--no-cov"]
# mutmut copies the source tree into mutants/ and runs the suite from there, so
# anything the code reads from disk has to come along. server.py opens the
# database at import time, which reads sql/schema.sql; test_personas reads the
# persona files. Without these the whole run dies during collection, before a
# single mutant is tried.
also_copy = ["sql/", "personas/", "ui/"]
